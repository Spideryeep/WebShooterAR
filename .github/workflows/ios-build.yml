name: iOS Build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iPhone (unsigned)
        run: xcodebuild -project WebShooterAR.xcodeproj -scheme WebShooterAR -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO build
